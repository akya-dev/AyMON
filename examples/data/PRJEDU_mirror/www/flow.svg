<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" width="660" height="470" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">
  <title>PRJEDU_mirror: a list that is a table</title>
  <!-- A sketch of the mirror: who loads, who writes, who else touches the table. -->
  <defs>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82c4"/></marker>
    <marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6b7385"/></marker>
    <marker id="arrk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1d2330"/></marker>
  </defs>
  <rect width="660" height="470" fill="#ffffff"/>
  <text x="16" y="24" font-size="14" font-weight="600" fill="#1d2330">PRJEDU_mirror: a list that is a table</text>

  <!-- the engine -->
  <rect x="16" y="40" width="330" height="268" rx="8" fill="#eaf4ec" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="28" y="60" font-weight="600" fill="#1f5f3b">WO/S00 · the engine</text>
  <rect x="28" y="70" width="306" height="152" rx="4" fill="#fff" stroke="#9aa3b2"/>
  <g font-size="10" font-family="ui-monospace, Consolas, monospace" fill="#1d2330">
    <text x="36" y="87" font-weight="600">&lt;his id="ORDERS" his_wri="row"&gt;</text>
    <text x="48" y="104">&lt;item id="WO2" status="1" ../&gt;</text>
    <text x="48" y="119">&lt;item id="WO3" status="0" ../&gt;</text>
    <text x="48" y="134">&lt;item id="WO4" status="0" ../&gt;</text>
    <text x="48" y="149">&lt;item id="WO5" status="0" ../&gt;</text>
  </g>
  <text x="246" y="149" font-size="10" fill="#d9731a">not written yet</text>
  <g font-size="10" fill="#6b7385">
    <text x="36" y="170">his_tbl wo · his_key wo_id · his_rid WO{wo_id}</text>
    <text x="36" y="184">his_load status &lt; 2 · his_ref 3 s · his_del keep</text>
    <text x="36" y="198">his_cls cls_WO: the columns' types</text>
    <text x="36" y="212">his_keygen max: a new key = the table's largest + 1</text>
  </g>
  <rect x="28" y="236" width="306" height="58" rx="4" fill="#fff" stroke="#9aa3b2"/>
  <text x="36" y="252" font-weight="600" fill="#1d2330">main.act <tspan font-weight="400" font-size="10" fill="#6b7385">the page's buttons</tspan></text>
  <text x="36" y="268" font-size="11" fill="#1d2330">New: ELM.new, HIS.key, the id his_rid gives</text>
  <text x="36" y="284" font-size="11" fill="#1d2330">Start, Finish: status, started, done</text>
  <path d="M180 236 V226" stroke="#1d2330" stroke-width="1.5" marker-end="url(#arrk)"/>
  <text x="188" y="232" font-size="10" fill="#6b7385">attributes, no SQL</text>

  <!-- the three SQL paths -->
  <g stroke="#3b82c4" stroke-width="2" fill="none">
    <path d="M346 116 H450" marker-end="url(#arrb)"/>
    <path d="M346 192 H450" marker-start="url(#arrb)"/>
    <path d="M346 266 H450" marker-start="url(#arrb)" stroke-dasharray="6 4"/>
  </g>
  <g font-size="10" fill="#3b82c4" text-anchor="middle">
    <text x="398" y="108">writes what</text>
    <text x="398" y="131">changed, in 1 s</text>
    <text x="398" y="184">loads status &lt; 2,</text>
    <text x="398" y="207">a merge, every 3 s</text>
    <text x="398" y="258">CN_READ: the</text>
    <text x="398" y="281">table, for the page</text>
  </g>

  <!-- the table -->
  <path d="M452 84 V296 A94 12 0 0 0 640 296 V84" fill="#fff" stroke="#1d2330" stroke-width="1.5"/>
  <ellipse cx="546" cy="84" rx="94" ry="12" fill="#f3f5f8" stroke="#1d2330" stroke-width="1.5"/>
  <text x="546" y="116" text-anchor="middle" font-weight="600" fill="#1d2330">log/orders.db</text>
  <text x="546" y="131" text-anchor="middle" font-size="10" fill="#6b7385">SQLite · table wo</text>
  <g font-size="9.5" font-family="ui-monospace, Consolas, monospace">
    <g fill="#6b7385"><text x="464" y="156">id</text><text x="480" y="156">title</text><text x="604" y="156">pr</text><text x="622" y="156">st</text></g>
    <g fill="#9aa3b2"><text x="464" y="173">1</text><text x="480" y="173">Replace the filter</text><text x="604" y="173">3</text><text x="622" y="173">2</text></g>
    <g fill="#1d2330"><text x="464" y="189">2</text><text x="480" y="189">Check the belt ..</text><text x="604" y="189">2</text><text x="622" y="189">1</text></g>
    <g fill="#1d2330"><text x="464" y="205">3</text><text x="480" y="205">Grease the bearings</text><text x="604" y="205">4</text><text x="622" y="205">0</text></g>
    <g fill="#1d2330"><text x="464" y="221">4</text><text x="480" y="221">Calibrate the ..</text><text x="604" y="221">2</text><text x="622" y="221">0</text></g>
  </g>
  <text x="546" y="262" text-anchor="middle" font-size="10" fill="#6b7385">st: 0 open, 1 started, 2 done</text>
  <text x="546" y="277" text-anchor="middle" font-size="10" fill="#6b7385">a done order stays in the table</text>
  <text x="546" y="290" text-anchor="middle" font-size="10" fill="#6b7385">and leaves the list</text>

  <!-- another program -->
  <rect x="452" y="336" width="188" height="56" rx="6" fill="#fff" stroke="#6b7385" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="462" y="354" font-weight="600" fill="#1d2330">CN_OTHER · another program</text>
  <text x="462" y="369" font-size="10" fill="#6b7385">a planning tool, a terminal:</text>
  <text x="462" y="383" font-size="10" fill="#6b7385">raises a priority, closes an order</text>
  <path d="M546 336 V314" stroke="#6b7385" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrs)"/>
  <text x="538" y="328" font-size="10" fill="#6b7385" text-anchor="end">nothing tells the engine</text>

  <!-- the page -->
  <path d="M120 308 V336" stroke="#7a5bc4" stroke-width="2"/>
  <g fill="#fff" stroke="#7a5bc4" stroke-width="1.5"><circle cx="120" cy="316" r="3"/><circle cx="120" cy="328" r="3"/></g>
  <rect x="16" y="336" width="330" height="74" rx="5" fill="#fff" stroke="#1d2330" stroke-width="1.5"/>
  <path d="M16 350 H346" stroke="#1d2330" stroke-width="1"/>
  <g fill="#9aa3b2"><circle cx="24" cy="343" r="2.5"/><circle cx="32" cy="343" r="2.5"/><circle cx="40" cy="343" r="2.5"/></g>
  <text x="50" y="347" font-size="9" fill="#6b7385" font-family="ui-monospace, Consolas, monospace">127.0.0.1:8117</text>
  <text x="24" y="366" font-size="11" font-weight="600" fill="#1d2330">the page: the list and the table side by side</text>
  <text x="24" y="381" font-size="10" fill="#1d2330">New, Start, Finish: the list. Raise a priority, Close an</text>
  <text x="24" y="394" font-size="10" fill="#1d2330">order at the machine: CN_OTHER, straight into the table.</text>

  <!-- legend -->
  <g font-size="11" fill="#1d2330">
    <path d="M16 436 H40" stroke="#3b82c4" stroke-width="2"/><text x="46" y="440">the mirror over CN_SQL</text>
    <path d="M186 436 H210" stroke="#3b82c4" stroke-width="2" stroke-dasharray="6 4"/><text x="216" y="440">CN_READ, for the page</text>
    <path d="M356 436 H380" stroke="#6b7385" stroke-width="1.5" stroke-dasharray="5 4"/><text x="386" y="440">another program</text>
    <path d="M496 436 H520" stroke="#7a5bc4" stroke-width="2"/><text x="526" y="440">HTTP + MQTT</text>
  </g>
  <text x="16" y="460" font-size="11" fill="#6b7385">No script writes SQL for an order: the mirror loads the table into the list and writes back what the list changes.</text>
</svg>
