<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" width="660" height="470" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">
  <title>PRJEDU_durable: values that come back after a crash</title>
  <!-- A sketch of what xdb_dur keeps, where it goes and what a kill loses. -->
  <defs>
    <marker id="arrk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1d2330"/></marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2e8b57"/></marker>
  </defs>
  <rect width="660" height="470" fill="#ffffff"/>
  <text x="16" y="24" font-size="14" font-weight="600" fill="#1d2330">PRJEDU_durable: values that come back after a crash</text>

  <!-- the engine's memory -->
  <rect x="16" y="40" width="236" height="250" rx="8" fill="#eaf4ec" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="28" y="60" font-weight="600" fill="#1f5f3b">MIX/S00 · in memory</text>
  <text x="28" y="76" font-size="10" fill="#6b7385">a timer makes a batch every second</text>
  <g font-size="10.5" fill="#1d2330">
    <g font-family="ui-monospace, Consolas, monospace" font-size="10">
      <text x="28" y="100">BATCHES</text><text x="28" y="118">HOURS</text><text x="28" y="136">SP</text><text x="28" y="154">LAST</text><text x="28" y="172">SHIFT</text><text x="28" y="190">JOBS</text>
      <text x="28" y="218" fill="#c0392b">SINCE</text>
    </g>
    <text x="96" y="100">123</text><text x="96" y="118">0.034 h</text><text x="96" y="136">61.5 kg</text><text x="96" y="154">batch 123: ..</text><text x="96" y="172">6</text><text x="96" y="190">10 rows</text>
    <text x="96" y="218" fill="#c0392b">40</text>
    <g font-size="10" fill="#2e8b57">
      <text x="160" y="100">val</text><text x="160" y="118">val</text><text x="160" y="136">val, the page</text><text x="160" y="154">val</text><text x="160" y="172">val, + sync</text><text x="160" y="190">*, the rows</text>
    </g>
    <text x="160" y="218" font-size="10" fill="#c0392b">not kept</text>
  </g>
  <text x="28" y="246" font-size="10" fill="#1d2330">xdb_dur="val" on an element,</text>
  <text x="28" y="259" font-size="10" fill="#1d2330">"*" on a list: rows made and removed</text>
  <text x="28" y="276" font-size="10" fill="#6b7385">no script writes anything to disk</text>

  <!-- the commit thread -->
  <path d="M252 140 H272" stroke="#1d2330" stroke-width="1.5" marker-end="url(#arrk)"/>
  <rect x="274" y="60" width="150" height="176" rx="6" fill="#fff" stroke="#9aa3b2" stroke-width="1.5"/>
  <text x="284" y="80" font-weight="600" fill="#1d2330">the commit thread</text>
  <g font-size="10" fill="#1d2330">
    <text x="284" y="100">a write only marks the</text>
    <text x="284" y="113">element: no wait, no copy</text>
    <text x="284" y="136">every 10 ms (<tspan font-family="ui-monospace, Consolas, monospace">rec_flush</tspan>)</text>
    <text x="284" y="149">the last value of each</text>
    <text x="284" y="162">marked one: a record</text>
    <text x="284" y="185">fsync every 1 s (<tspan font-family="ui-monospace, Consolas, monospace">rec_sync</tspan>)</text>
    <text x="284" y="208">a checkpoint every 60 s</text>
    <text x="284" y="221">(<tspan font-family="ui-monospace, Consolas, monospace">rec_ckp</tspan>), old segments go</text>
  </g>
  <path d="M424 140 H444" stroke="#1d2330" stroke-width="1.5" marker-end="url(#arrk)"/>

  <!-- the disk -->
  <rect x="446" y="60" width="198" height="176" rx="6" fill="#f3f5f8" stroke="#1d2330" stroke-width="1.5"/>
  <path d="M456 72 h22 l6 6 h30 v16 h-58 z" fill="#f2c94c" stroke="#9a7d1e"/>
  <text x="522" y="88" font-size="11" font-weight="600" fill="#1d2330">log/rec/ <tspan font-weight="400" font-size="10" fill="#6b7385">rec_dir</tspan></text>
  <g font-size="9.5" fill="#1d2330">
    <text x="456" y="114" font-family="ui-monospace, Consolas, monospace">dur_00000037.wal</text><text x="560" y="114" fill="#6b7385">a segment</text>
    <text x="456" y="130" font-family="ui-monospace, Consolas, monospace">dur_00000038.wal</text><text x="560" y="130" fill="#6b7385">being written</text>
    <text x="456" y="146" font-family="ui-monospace, Consolas, monospace">dur_MIX%2FS00.ckp</text><text x="560" y="146" fill="#6b7385">checkpoint</text>
    <text x="456" y="162" font-family="ui-monospace, Consolas, monospace">dur_free_0.wal</text><text x="560" y="162" fill="#6b7385">ready for use</text>
  </g>
  <rect x="456" y="178" width="178" height="48" rx="4" fill="#fff" stroke="#9aa3b2" stroke-dasharray="4 3"/>
  <text x="464" y="194" font-size="10" fill="#6b7385" font-family="ui-monospace, Consolas, monospace">db/db_MIX.xml</text>
  <text x="464" y="208" font-size="10" fill="#6b7385">read at start, never written:</text>
  <text x="464" y="220" font-size="10" fill="#6b7385">its SP stays 50</text>

  <!-- a kill and the next start -->
  <rect x="16" y="306" width="628" height="110" rx="6" fill="#fff" stroke="#9aa3b2" stroke-width="1.5"/>
  <text x="28" y="324" font-size="11" fill="#6b7385">kill.bat, then run.bat</text>
  <path d="M40 360 H300" stroke="#2e8b57" stroke-width="3"/>
  <path d="M330 360 H392" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M420 360 H630" stroke="#2e8b57" stroke-width="3" marker-end="url(#arrg)"/>
  <path d="M306 342 L316 356 L308 358 L320 378 L300 360 L310 358 Z" fill="#c0392b"/>
  <text x="40" y="350" font-size="10.5" fill="#1d2330">running: batch 121, 122, 123</text>
  <text x="40" y="378" font-size="10" fill="#6b7385">the page set SP to 61.5 kg</text>
  <text x="290" y="396" font-size="10.5" text-anchor="middle" fill="#c0392b">killed</text>
  <text x="290" y="409" font-size="9.5" text-anchor="middle" fill="#6b7385">or the power cut</text>
  <text x="420" y="350" font-size="10.5" fill="#1d2330">back: batch 124 next, SP 61.5 kg,</text>
  <text x="420" y="378" font-size="10" fill="#6b7385">10 rows, SHIFT 6; SINCE begins at 0</text>
  <text x="420" y="392" font-size="10" fill="#6b7385">read back before anything reads a</text>
  <text x="420" y="405" font-size="10" fill="#6b7385">value: no event, no SQL</text>

  <!-- what is lost -->
  <text x="16" y="440" font-size="11" fill="#1d2330">A kill loses at most the last 10 ms (rec_flush). A power cut at most 1 s (rec_sync) and an fsync that was running.</text>
  <text x="16" y="458" font-size="11" fill="#6b7385">Every 20th batch closes a shift and waits for the disk: xdb.sync() answers once the value is on it.</text>
</svg>
