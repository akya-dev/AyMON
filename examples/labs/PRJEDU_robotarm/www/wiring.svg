<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 560" width="660" height="560" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">
  <title>PRJEDU_robotarm: how a real cell is wired</title>
  <!-- A sketch from the README's "Real hardware" section. The robot's manual decides; safety circuits stay the robot's. -->
  <rect width="660" height="560" fill="#ffffff"/>
  <text x="16" y="24" font-size="14" font-weight="600" fill="#1d2330">PRJEDU_robotarm: the cell's wiring</text>

  <!-- AyMON and the network -->
  <rect x="16" y="76" width="170" height="68" rx="6" fill="#eaf4ec" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="28" y="96" font-weight="600" fill="#1d2330">AyMON · CEL/S00</text>
  <text x="28" y="112" font-size="11" fill="#1d2330">the cell controller</text>
  <text x="28" y="128" font-size="11" fill="#6b7385">PC / Raspberry Pi · 192.168.1.10</text>
  <rect x="226" y="92" width="90" height="36" rx="4" fill="#fff" stroke="#9aa3b2" stroke-width="1.5"/>
  <text x="271" y="114" text-anchor="middle" font-size="11">switch</text>
  <g stroke="#3b82c4" stroke-width="2.5"><path d="M186 110 H226"/><path d="M316 110 H386"/></g>
  <text x="351" y="102" text-anchor="middle" font-size="10" fill="#3b82c4">Ethernet</text>

  <!-- the UR control box -->
  <rect x="386" y="44" width="258" height="300" rx="6" fill="#f3f5f8" stroke="#6b7385" stroke-width="2"/>
  <text x="398" y="64" font-weight="600" fill="#1d2330">UR control box (e-Series)</text>
  <text x="398" y="80" font-size="11" fill="#6b7385">192.168.1.20 · or URSim, UR's simulator</text>
  <rect x="380" y="104" width="12" height="12" fill="#3b82c4"/>
  <text x="398" y="108" font-size="11" fill="#1d2330">LAN: 29999 dashboard server</text>
  <text x="398" y="124" font-size="11" fill="#1d2330" dx="25">502 Modbus TCP server</text>
  <!-- the safety I/O terminals -->
  <rect x="398" y="140" width="234" height="122" rx="4" fill="#fff" stroke="#9aa3b2"/>
  <text x="406" y="156" font-size="11" font-weight="600" fill="#c0392b">safety I/O, two channels each</text>
  <text x="406" y="180" font-size="11" fill="#1d2330">emergency stop</text>
  <text x="406" y="222" font-size="11" fill="#1d2330">safeguard stop</text>
  <text x="406" y="252" font-size="11" fill="#1d2330">configurable input</text>
  <g fill="#fff" stroke="#1d2330" stroke-width="1.2">
    <circle cx="386" cy="172" r="3"/><circle cx="386" cy="186" r="3"/>
    <circle cx="386" cy="214" r="3"/><circle cx="386" cy="228" r="3"/>
    <circle cx="386" cy="250" r="3"/>
  </g>
  <text x="398" y="288" font-size="11" fill="#1d2330">teach pendant · robot cable</text>
  <text x="398" y="304" font-size="11" fill="#1d2330">tool connector: 24 V, tool output 0</text>
  <text x="398" y="330" font-size="11" fill="#6b7385">mains 100-240 V AC: L, N, PE</text>

  <!-- the emergency stop button: two channels -->
  <circle cx="256" cy="179" r="13" fill="#c0392b" stroke="#7a1f14" stroke-width="1.5"/>
  <rect x="246" y="192" width="20" height="8" fill="#f2c94c" stroke="#9a7d1e"/>
  <g stroke="#c0392b" stroke-width="2" fill="none"><path d="M269 172 H383 M269 186 H383"/></g>
  <text x="180" y="176" font-size="11" text-anchor="end" fill="#1d2330">E-stop button</text>
  <text x="180" y="190" font-size="10" text-anchor="end" fill="#6b7385">beside the pendant's own</text>
  <!-- the guard door switch: two channels -->
  <rect x="236" y="206" width="40" height="30" rx="3" fill="#fff" stroke="#1d2330" stroke-width="1.5"/>
  <path d="M244 214 H256 L266 208 M244 228 H256 L266 222" stroke="#1d2330" stroke-width="1.2" fill="none"/>
  <g stroke="#c0392b" stroke-width="2" fill="none"><path d="M276 214 H383 M276 228 H383"/></g>
  <text x="180" y="218" font-size="11" text-anchor="end" fill="#1d2330">guard door switch</text>
  <text x="180" y="232" font-size="10" text-anchor="end" fill="#6b7385">the page's DOOR button</text>
  <!-- an optional part sensor -->
  <rect x="236" y="244" width="26" height="14" fill="#fff" stroke="#1d2330" stroke-width="1.5"/>
  <path d="M262 250 H383" stroke="#d9731a" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
  <text x="180" y="252" font-size="11" text-anchor="end" fill="#1d2330">part sensor, 24 V PNP</text>
  <text x="180" y="266" font-size="10" text-anchor="end" fill="#6b7385">not in this example (a timer)</text>

  <!-- the teach pendant -->
  <rect x="16" y="290" width="110" height="60" rx="6" fill="#fff" stroke="#1d2330" stroke-width="1.5"/>
  <rect x="26" y="298" width="66" height="44" rx="2" fill="#dfe8f6" stroke="#9aa3b2"/>
  <circle cx="108" cy="306" r="7" fill="#c0392b"/>
  <text x="16" y="366" font-size="11" fill="#1d2330">teach pendant</text>
  <path d="M126 320 H300 V296 H386" stroke="#1d2330" stroke-width="2" fill="none"/>

  <!-- the arm, its cable and the gripper -->
  <path d="M500 344 V476 H468" stroke="#1d2330" stroke-width="3" fill="none"/>
  <text x="508" y="396" font-size="11" fill="#1d2330">robot cable</text>
  <text x="508" y="410" font-size="10" fill="#6b7385">power and data</text>
  <rect x="400" y="470" width="68" height="16" rx="3" fill="#9aa3b2"/>
  <g stroke="#6b7385" stroke-width="12" stroke-linecap="round" fill="none"><path d="M434 470 V430 L380 410 L340 440"/></g>
  <g fill="#fff" stroke="#1d2330" stroke-width="1.5"><circle cx="434" cy="430" r="7"/><circle cx="380" cy="410" r="7"/><circle cx="340" cy="440" r="6"/></g>
  <path d="M340 446 V462 M332 462 V478 M348 462 V478 M332 462 H348" stroke="#1d2330" stroke-width="2.5" fill="none"/>
  <text x="356" y="398" font-size="11" text-anchor="end" fill="#1d2330">UR5e arm</text>
  <text x="300" y="496" font-size="11" text-anchor="end" fill="#1d2330">gripper on the tool connector</text>
  <text x="300" y="510" font-size="10" text-anchor="end" fill="#6b7385">register 130; the page's GRIP</text>

  <!-- legend -->
  <g font-size="11" fill="#1d2330">
    <path d="M16 534 H40" stroke="#3b82c4" stroke-width="2.5"/><text x="46" y="538">Ethernet</text>
    <path d="M104 534 H128" stroke="#c0392b" stroke-width="2"/><text x="134" y="538">safety circuit</text>
    <path d="M222 534 H246" stroke="#d9731a" stroke-width="2" stroke-dasharray="6 4"/><text x="252" y="538">24 V I/O</text>
    <path d="M310 534 H334" stroke="#1d2330" stroke-width="2.5"/><text x="340" y="538">cables</text>
  </g>
  <text x="16" y="554" font-size="11" fill="#6b7385">The robot's manual decides. Safety circuits stay the robot's: they never go through AyMON.</text>
</svg>
