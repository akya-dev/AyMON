<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 500" width="660" height="500" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">
  <title>PRJEDU_pycall: two queued calls into Python</title>
  <!-- A sketch of the simulated pump, the two threads, the one queue into Python and where the answers land. -->
  <defs>
    <marker id="arrk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1d2330"/></marker>
    <marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6b7385"/></marker>
  </defs>
  <rect width="660" height="500" fill="#ffffff"/>
  <text x="16" y="24" font-size="14" font-weight="600" fill="#1d2330">PRJEDU_pycall: two queued calls into Python</text>

  <!-- the pump, simulated -->
  <rect x="16" y="40" width="146" height="300" rx="6" fill="#fff" stroke="#6b7385" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="26" y="58" font-weight="600" fill="#1d2330">the pump, its sensor</text>
  <text x="26" y="72" font-size="10" fill="#6b7385">simulated: main.sense</text>
  <path d="M83 126 V142" stroke="#1d2330" stroke-width="1.5"/>
  <circle cx="83" cy="112" r="14" fill="#fff" stroke="#1d2330" stroke-width="1.5"/>
  <text x="83" y="116" text-anchor="middle" font-size="11" font-weight="600" fill="#1d2330">VT</text>
  <rect x="24" y="136" width="42" height="30" rx="3" fill="#f3f5f8" stroke="#1d2330" stroke-width="1.5"/>
  <text x="45" y="156" text-anchor="middle" font-weight="600" fill="#1d2330">M</text>
  <path d="M66 151 H104" stroke="#1d2330" stroke-width="2.5"/>
  <rect x="76" y="142" width="14" height="18" fill="#9aa3b2" stroke="#1d2330" stroke-width="1.2"/>
  <circle cx="120" cy="151" r="16" fill="#fff" stroke="#1d2330" stroke-width="2"/>
  <path d="M112 141 L132 151 L112 161 Z" fill="#1d2330"/>
  <g font-size="10" fill="#1d2330" text-anchor="middle">
    <text x="45" y="182">motor</text><text x="83" y="182">bearing</text><text x="120" y="182">pump</text>
  </g>
  <text x="26" y="196" font-size="10" fill="#6b7385">1500 rpm, 25 Hz</text>
  <g font-size="10" fill="#1d2330">
    <text x="26" y="218">every 2 s, a block:</text>
    <text x="26" y="231">512 samples at 2560 Hz</text>
    <text x="26" y="251">the outer race at 90 Hz</text>
    <text x="26" y="264">grows by itself (FAULT):</text>
    <text x="26" y="277">a warning in ~1.5 min,</text>
    <text x="26" y="290">an alarm a minute later</text>
  </g>
  <text x="26" y="312" font-size="10" fill="#6b7385">Replace the bearing</text>
  <text x="26" y="325" font-size="10" fill="#6b7385">and it starts again</text>

  <!-- the engine -->
  <rect x="176" y="40" width="468" height="300" rx="8" fill="#eaf4ec" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="188" y="58" font-weight="600" fill="#1f5f3b">VIB/S00 · the engine <tspan font-weight="400" font-size="10" fill="#6b7385">one AyXDB process</tspan></text>

  <!-- TH_MAIN -->
  <rect x="188" y="66" width="210" height="196" rx="4" fill="#fff" stroke="#9aa3b2"/>
  <text x="196" y="82" font-weight="600" fill="#1d2330">TH_MAIN <tspan font-weight="400" font-size="10" fill="#6b7385">the document's timers</tspan></text>
  <rect x="196" y="90" width="194" height="48" rx="3" fill="#f3f5f8" stroke="#9aa3b2"/>
  <text x="204" y="105" font-weight="600" fill="#1d2330">main.sense <tspan font-weight="400" font-size="10" fill="#6b7385">every 2 s</tspan></text>
  <text x="204" y="119" font-size="10" fill="#1d2330">writes the block into WAVE:</text>
  <text x="204" y="132" font-size="10" fill="#1d2330">{t, fs, x: [512]}, and goes on</text>
  <rect x="196" y="150" width="194" height="48" rx="3" fill="#f3f5f8" stroke="#9aa3b2"/>
  <text x="204" y="165" font-weight="600" fill="#1d2330">WAVE <tspan font-weight="400" font-size="10" fill="#6b7385">val_typ 0x1401</tspan></text>
  <text x="204" y="179" font-size="9.5" fill="#1d2330" font-family="ui-monospace, Consolas, monospace">val_fnc="[vib.analyse]"</text>
  <text x="204" y="192" font-size="10" fill="#1d2330">an event call: queued, not run</text>
  <rect x="196" y="206" width="194" height="48" rx="3" fill="#f3f5f8" stroke="#9aa3b2"/>
  <text x="204" y="221" font-weight="600" fill="#1d2330">main.ask <tspan font-weight="400" font-size="10" fill="#6b7385">every 5 s</tspan></text>
  <text x="204" y="235" font-size="9.5" fill="#1d2330" font-family="ui-monospace, Consolas, monospace">q = vib.forecast(4.5, now)</text>
  <text x="204" y="248" font-size="10" fill="#1d2330">q = 1, queued: never the result</text>

  <!-- the Python thread -->
  <rect x="420" y="66" width="212" height="196" rx="4" fill="#fff" stroke="#9aa3b2"/>
  <text x="428" y="82" font-weight="600" fill="#1d2330">vib · db_VIB.py</text>
  <text x="428" y="96" font-size="10" fill="#6b7385">Python 3.11 / 3.13, no numpy</text>
  <text x="428" y="110" font-size="10" fill="#1d2330">AyLIB_Python: one thread, every</text>
  <text x="428" y="123" font-size="10" fill="#1d2330">20 ms; one queue, a call at a time</text>
  <g fill="#f3f5f8" stroke="#9aa3b2">
    <rect x="428" y="134" width="16" height="15"/><rect x="428" y="149" width="16" height="15"/><rect x="428" y="164" width="16" height="15"/>
    <rect x="428" y="179" width="16" height="15"/><rect x="428" y="194" width="16" height="15"/><rect x="428" y="209" width="16" height="15"/>
    <rect x="428" y="224" width="16" height="15"/><rect x="428" y="239" width="16" height="15"/>
  </g>
  <rect x="452" y="134" width="172" height="62" rx="3" fill="#f3f5f8" stroke="#9aa3b2"/>
  <text x="460" y="149" font-weight="600" fill="#1d2330">analyse(evt)</text>
  <g font-size="10" fill="#1d2330">
    <text x="460" y="163">RMS, peak, crest, spectrum,</text>
    <text x="460" y="176">the 80..100 Hz band (BPFO)</text>
    <text x="460" y="189">waited over 4 s: dropped</text>
  </g>
  <rect x="452" y="206" width="172" height="48" rx="3" fill="#f3f5f8" stroke="#9aa3b2"/>
  <text x="460" y="221" font-weight="600" fill="#1d2330">forecast(limit, stamp)</text>
  <g font-size="10" fill="#1d2330">
    <text x="460" y="235">when RMS reaches the limit:</text>
    <text x="460" y="248">a line through the last minute</text>
  </g>

  <!-- what Python writes, and the page's side -->
  <rect x="420" y="276" width="212" height="54" rx="4" fill="#fff" stroke="#9aa3b2"/>
  <g font-size="10" fill="#1d2330">
    <text x="428" y="292"><tspan font-weight="600" font-size="11">RMS</tspan> ALM.onlvl 2.8 / 4.5 mm/s</text>
    <text x="428" y="306"><tspan font-weight="600" font-size="11">BPFO</tspan> ALM.onlvl 1.5 / 3.0 mm/s</text>
    <text x="428" y="320">PEAK, CREST, FREQ, SPEC, FORECAST</text>
  </g>
  <rect x="188" y="276" width="210" height="54" rx="4" fill="#fff" stroke="#9aa3b2"/>
  <text x="196" y="292" font-weight="600" fill="#1d2330">CN_WEB :8112 · CN_LIVE /mqtt</text>
  <g font-size="10" fill="#1d2330">
    <text x="196" y="306">SERVICE: the one value the page</text>
    <text x="196" y="319">may write; main.service: FAULT 0.3</text>
  </g>

  <!-- the calls -->
  <g stroke="#1d2330" stroke-width="1.5" fill="none">
    <path d="M240 138 V148" marker-end="url(#arrk)"/>
    <path d="M390 174 H426" marker-end="url(#arrk)"/>
    <path d="M390 230 H426" marker-end="url(#arrk)"/>
    <path d="M538 262 V274" marker-end="url(#arrk)"/>
    <path d="M420 303 H400" marker-end="url(#arrk)"/>
  </g>
  <path d="M97 112 H194" stroke="#6b7385" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrs)"/>

  <!-- link to the page -->
  <path d="M293 330 V362" stroke="#7a5bc4" stroke-width="2"/>
  <g fill="#fff" stroke="#7a5bc4" stroke-width="1.5"><circle cx="293" cy="347" r="3"/><circle cx="293" cy="355" r="3"/></g>
  <text x="302" y="355" font-size="10" fill="#7a5bc4">HTTP + MQTT</text>

  <!-- the page -->
  <rect x="176" y="362" width="468" height="82" rx="5" fill="#fff" stroke="#1d2330" stroke-width="1.5"/>
  <path d="M176 376 H644" stroke="#1d2330" stroke-width="1"/>
  <g fill="#9aa3b2"><circle cx="184" cy="369" r="2.5"/><circle cx="192" cy="369" r="2.5"/><circle cx="200" cy="369" r="2.5"/></g>
  <text x="210" y="373" font-size="9" fill="#6b7385" font-family="ui-monospace, Consolas, monospace">127.0.0.1:8112</text>
  <text x="184" y="393" font-size="11" font-weight="600" fill="#1d2330">the page: the figures, the block, its spectrum, RMS and the forecast</text>
  <g font-size="10" fill="#1d2330">
    <text x="184" y="408">Call 1 and Call 2: how long each waited in the queue and ran in Python</text>
    <text x="184" y="422">writes SERVICE, "Replace the bearing", and nothing else (xdb_acl)</text>
  </g>
  <text x="184" y="437" font-size="10" fill="#6b7385">a Guest: a write to RMS is refused, one ALERT line in the log</text>

  <!-- a real sensor -->
  <rect x="16" y="362" width="146" height="82" rx="5" fill="#fff" stroke="#9aa3b2" stroke-width="1.5"/>
  <text x="24" y="378" font-size="11" font-weight="600" fill="#1d2330">a real sensor</text>
  <g font-size="10" fill="#1d2330">
    <text x="24" y="393">ADXL345 / 355 on an ESP32</text>
    <text x="24" y="406">publishes it over MQTT to</text>
    <text x="24" y="420" font-size="9" font-family="ui-monospace, Consolas, monospace">VIB/S00/WAVE/val/set</text>
    <text x="24" y="434">on its own connection</text>
  </g>

  <!-- legend -->
  <g font-size="11" fill="#1d2330">
    <path d="M16 466 H40" stroke="#1d2330" stroke-width="1.5" marker-end="url(#arrk)"/><text x="46" y="470">a write or a call, inside the engine</text>
    <path d="M246 466 H270" stroke="#7a5bc4" stroke-width="2"/><text x="276" y="470">HTTP + MQTT to the page</text>
    <path d="M430 466 H454" stroke="#6b7385" stroke-width="1.5" stroke-dasharray="5 4"/><text x="460" y="470">simulated here</text>
  </g>
  <text x="16" y="490" font-size="11" fill="#6b7385">No caller waits for Python: its answers arrive as points, rounded and alarmed like any measurement.</text>
</svg>
