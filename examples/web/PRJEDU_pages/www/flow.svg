<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" width="660" height="470" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">
  <title>PRJEDU_pages: a page the engine writes</title>
  <!-- A sketch of one request to a server page and of the tank farm behind it. -->
  <defs>
    <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a5bc4"/></marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e8b57"/></marker>
    <clipPath id="t1"><rect x="480" y="66" width="36" height="76" rx="6"/></clipPath>
    <clipPath id="t2"><rect x="538" y="66" width="36" height="76" rx="6"/></clipPath>
    <clipPath id="t3"><rect x="596" y="66" width="36" height="76" rx="6"/></clipPath>
  </defs>
  <rect width="660" height="470" fill="#ffffff"/>
  <text x="16" y="24" font-size="14" font-weight="600" fill="#1d2330">PRJEDU_pages: a page the engine writes</text>

  <!-- the browser -->
  <rect x="16" y="40" width="186" height="210" rx="5" fill="#fff" stroke="#1d2330" stroke-width="1.5"/>
  <path d="M16 54 H202" stroke="#1d2330" stroke-width="1"/>
  <g fill="#9aa3b2"><circle cx="24" cy="47" r="2.5"/><circle cx="32" cy="47" r="2.5"/><circle cx="40" cy="47" r="2.5"/></g>
  <text x="50" y="51" font-size="9" fill="#6b7385" font-family="ui-monospace, Consolas, monospace">/tank.ayp?id=T2</text>
  <rect x="17" y="55" width="184" height="16" fill="#2b3a55"/>
  <text x="24" y="67" font-size="9" fill="#fff" font-weight="600">Tank farm <tspan font-weight="400" fill="#cfe0ff">  Overview  Access  API</tspan></text>
  <text x="24" y="90" font-weight="600" fill="#1d2330">Treated water</text>
  <text x="24" y="107" font-size="10.5" fill="#1d2330">Level 72.4 %</text>
  <rect x="100" y="99" width="90" height="8" fill="#e3e5ea"/><rect x="100" y="99" width="65" height="8" fill="#4a7bd0"/>
  <text x="24" y="124" font-size="10.5" fill="#1d2330">Pump running</text>
  <rect x="22" y="134" width="174" height="62" rx="3" fill="#f6f7f9" stroke="#e3e5ea"/>
  <text x="30" y="150" font-size="10" fill="#6b7385">an operator after login:</text>
  <text x="30" y="167" font-size="10" fill="#1d2330">stop at</text><rect x="68" y="157" width="28" height="14" fill="#fff" stroke="#9aa3b2"/><text x="72" y="168" font-size="9.5">85</text>
  <text x="102" y="167" font-size="10" fill="#1d2330">start at</text><rect x="142" y="157" width="28" height="14" fill="#fff" stroke="#9aa3b2"/><text x="146" y="168" font-size="9.5">40</text>
  <rect x="30" y="176" width="36" height="14" rx="2" fill="#e3e5ea" stroke="#9aa3b2"/><text x="36" y="187" font-size="9">Save</text>
  <text x="72" y="187" font-size="9" fill="#6b7385">+ the login's _csrf</text>
  <text x="24" y="214" font-size="10" fill="#6b7385">a Guest: the set points, no form,</text>
  <text x="24" y="227" font-size="10" fill="#6b7385">"Log in as an operator"</text>
  <text x="24" y="243" font-size="10" fill="#6b7385">no JavaScript, no API behind it</text>

  <!-- request and answer -->
  <path d="M202 96 H232" stroke="#7a5bc4" stroke-width="2" marker-end="url(#arrp)"/>
  <path d="M232 186 H204" stroke="#7a5bc4" stroke-width="2" marker-end="url(#arrp)"/>

  <!-- the engine -->
  <rect x="234" y="40" width="206" height="268" rx="8" fill="#eaf4ec" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="244" y="60" font-weight="600" fill="#1f5f3b">FARM/S00 · the engine</text>
  <g font-size="10.5" fill="#1d2330">
    <text x="244" y="82"><tspan font-weight="600">1</tspan>  CN_WEB (PRO.http, port 8115)</text>
    <text x="256" y="96">finds www/tank.ayp</text>
    <text x="244" y="118"><tspan font-weight="600">2</tspan>  first time, or a file changed:</text>
    <text x="256" y="132">translates it into a script, kept</text>
    <text x="244" y="154"><tspan font-weight="600">3</tspan>  runs it with the visitor's role:</text>
    <text x="256" y="168">Guest 0, opr 3, eng 6</text>
    <text x="244" y="190"><tspan font-weight="600">4</tspan>  answers the HTML it wrote;</text>
    <text x="256" y="204">a POST: 303 to the page again</text>
  </g>
  <rect x="244" y="216" width="186" height="82" rx="4" fill="#fff" stroke="#9aa3b2"/>
  <g font-size="10" fill="#1d2330">
    <text x="252" y="232" font-weight="600">the login is the engine's</text>
    <text x="252" y="246">con_auth="A_FARM": the engine</text>
    <text x="252" y="259">answers /auth/login and logoff,</text>
    <text x="252" y="272">sets an HttpOnly cookie, and</text>
    <text x="252" y="285">checks a POST's CSRF token: 403</text>
  </g>

  <!-- the plant -->
  <path d="M440 118 H466" stroke="#2e8b57" stroke-width="2"/><g fill="#fff" stroke="#2e8b57" stroke-width="1.5"><circle cx="448" cy="118" r="3"/><circle cx="458" cy="118" r="3"/></g>
  <text x="452" y="110" text-anchor="middle" font-size="9" fill="#2e8b57">evt</text>
  <rect x="466" y="40" width="178" height="268" rx="6" fill="#f3f5f8" stroke="#9aa3b2" stroke-width="1.5"/>
  <rect x="480" y="102" width="36" height="40" fill="#cfe4f7" clip-path="url(#t1)"/>
  <rect x="538" y="85" width="36" height="57" fill="#cfe4f7" clip-path="url(#t2)"/>
  <rect x="596" y="118" width="36" height="24" fill="#e8d7a8" clip-path="url(#t3)"/>
  <g fill="none" stroke="#1d2330" stroke-width="1.5">
    <rect x="480" y="66" width="36" height="76" rx="6"/><rect x="538" y="66" width="36" height="76" rx="6"/><rect x="596" y="66" width="36" height="76" rx="6"/>
  </g>
  <g fill="#1d2330" font-size="10" font-weight="600" text-anchor="middle"><text x="498" y="60">T1</text><text x="556" y="60">T2</text><text x="614" y="60">T3</text></g>
  <g stroke="#1d2330" stroke-width="1.5" fill="none"><path d="M498 142 V156 M556 142 V156 M614 142 V156"/></g>
  <g fill="#fff" stroke="#1d2330" stroke-width="1.5"><circle cx="498" cy="164" r="8"/><circle cx="556" cy="164" r="8"/><circle cx="614" cy="164" r="8"/></g>
  <g fill="#1d2330"><path d="M494 159 L504 164 L494 169 Z"/><path d="M552 159 L562 164 L552 169 Z"/><path d="M610 159 L620 164 L610 169 Z"/></g>
  <g font-size="10" fill="#1d2330">
    <text x="476" y="194">T1 Raw water, 30 .. 80 %</text>
    <text x="476" y="208">T2 Treated water, 40 .. 85 %</text>
    <text x="476" y="222">T3 Oil &amp; grease &lt;sump&gt;</text>
    <text x="476" y="246" fill="#6b7385">a pump each, switched by a</text>
    <text x="476" y="259" fill="#6b7385">level controller in db_FARM.js</text>
    <text x="476" y="280" fill="#6b7385">set points: all read, Operator</text>
    <text x="476" y="293" fill="#6b7385">and up write (xdb_acl)</text>
  </g>

  <!-- the template and what it writes -->
  <rect x="16" y="326" width="628" height="78" rx="6" fill="#fff" stroke="#9aa3b2" stroke-width="1.5"/>
  <text x="28" y="344" font-size="11" fill="#6b7385">a line of a template</text>
  <text x="28" y="362" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#1d2330">&lt;p&gt;Level: <tspan fill="#2e8b57">&lt;%= evt.GetValue("id('T2_LVL')/@val") %&gt;</tspan> %&lt;/p&gt;</text>
  <text x="28" y="380" font-size="11" fill="#6b7385">what the browser gets</text>
  <text x="28" y="396" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#1d2330">&lt;p&gt;Level: <tspan fill="#2e8b57">72.4</tspan> %&lt;/p&gt;</text>
  <text x="380" y="362" font-size="10" fill="#6b7385">&lt;%= %&gt; escapes: T3's name comes</text>
  <text x="380" y="376" font-size="10" fill="#6b7385">out as Oil &amp;amp; grease &amp;lt;sump&amp;gt;,</text>
  <text x="380" y="390" font-size="10" fill="#6b7385">never as markup</text>

  <!-- legend -->
  <g font-size="11" fill="#1d2330">
    <path d="M16 428 H40" stroke="#7a5bc4" stroke-width="2"/><text x="46" y="432">HTTP: a request, the HTML answer</text>
    <path d="M256 428 H280" stroke="#2e8b57" stroke-width="2"/><text x="286" y="432">evt.GetValue / evt.SetValue on the tree</text>
  </g>
  <text x="16" y="452" font-size="11" fill="#6b7385">The form is hidden from a Guest, but xdb_acl is what guards the set points: a page has the visitor's rights.</text>
</svg>
