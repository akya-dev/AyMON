<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" width="660" height="460" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">
  <title>PRJEDU_telnet: a shell into a running engine</title>
  <!-- A sketch of the maintenance shell: who connects on which port, the three gates, how a line is run and what each role may read or change. -->
  <defs>
    <marker id="arrk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1d2330"/></marker>
    <g id="gate"><circle r="8" fill="#2e8b57"/></g>
  </defs>
  <rect width="660" height="460" fill="#ffffff"/>
  <text x="16" y="24" font-size="14" font-weight="600" fill="#1d2330">PRJEDU_telnet: a shell into a running engine</text>

  <!-- the terminal -->
  <rect x="16" y="44" width="174" height="168" rx="5" fill="#1d2330"/>
  <g font-size="9.5" font-family="ui-monospace, Consolas, monospace" fill="#9fe3b0">
    <text x="24" y="60" fill="#d7dbe3">C:\&gt; shell.bat -Tls</text>
    <text x="24" y="76">login: opr</text>
    <text x="24" y="89">password:</text>
    <text x="24" y="102">user 'opr', role 3</text>
    <text x="24" y="118">SHL/S00&gt; plant</text>
    <text x="24" y="131">level 30 %, pump off,</text>
    <text x="24" y="144">mode auto, step 16</text>
    <text x="24" y="160">SHL/S00&gt; 1+1</text>
    <text x="24" y="173">2</text>
    <text x="24" y="189">SHL/S00&gt; log on 4</text>
    <text x="24" y="202" fill="#d7dbe3">|..|WARN | SHL/S00:LEVEL ..</text>
  </g>
  <g font-size="10" fill="#6b7385">
    <text x="16" y="230">shell.bat (shell.ps1), shell.py,</text>
    <text x="16" y="243">PuTTY in Telnet mode, or</text>
    <text x="16" y="256">openssl s_client -quiet</text>
  </g>

  <!-- the console it replaces -->
  <rect x="16" y="276" width="194" height="76" rx="5" fill="#f3f5f8" stroke="#9aa3b2"/>
  <text x="24" y="293" font-size="10.5" font-weight="600" fill="#1d2330">the CTRL-X console, beside it</text>
  <g font-size="10" fill="#1d2330">
    <text x="24" y="308">AyXDB.exe's own prompt reads</text>
    <text x="24" y="321">stdin, runs as SYSTEM, sees all;</text>
    <text x="24" y="334">a service has no console:</text>
    <text x="24" y="347">the shell is it on a socket</text>
  </g>

  <!-- the engine -->
  <rect x="236" y="40" width="408" height="340" rx="8" fill="#eaf4ec" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="248" y="58" font-weight="600" fill="#1f5f3b">SHL/S00 · the engine, a plant running</text>

  <!-- gate 1: the listeners -->
  <rect x="248" y="66" width="156" height="86" rx="4" fill="#fff" stroke="#9aa3b2"/>
  <use href="#gate" x="260" y="80"/><text x="260" y="84" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">1</text>
  <text x="274" y="84" font-size="10" font-weight="600" fill="#1d2330">con_acl="127.0.0.1"</text>
  <g font-size="9.5" font-family="ui-monospace, Consolas, monospace" fill="#1d2330">
    <text x="256" y="104">CN_TEL</text><text x="310" y="104">CON.tcp :2323</text>
    <text x="256" y="126">CN_TELS</text><text x="310" y="126">CON.tls :2324</text>
  </g>
  <text x="256" y="145" font-size="10" fill="#6b7385">refused before the banner</text>

  <g stroke="#1d2330" stroke-width="2"><path d="M190 100 H248"/><path d="M190 122 H248"/></g>
  <g fill="#fff" stroke="#1d2330" stroke-width="1.5">
    <circle cx="200" cy="100" r="3"/><circle cx="210" cy="100" r="3"/>
    <circle cx="200" cy="122" r="3"/><circle cx="210" cy="122" r="3"/>
  </g>
  <text x="196" y="94" font-size="9" fill="#c0392b">plain</text>
  <text x="196" y="138" font-size="9" fill="#1d2330">TLS</text>

  <!-- gate 2: the login -->
  <rect x="418" y="66" width="214" height="86" rx="4" fill="#fff" stroke="#9aa3b2"/>
  <use href="#gate" x="430" y="80"/><text x="430" y="84" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">2</text>
  <text x="444" y="84" font-size="10" font-weight="600" fill="#1d2330">con_auth="A_SHELL"</text>
  <g font-size="9.5" font-family="ui-monospace, Consolas, monospace" fill="#1d2330">
    <text x="426" y="102">admin 7</text><text x="478" y="102">eng 6</text><text x="520" y="102">opr 3</text><text x="562" y="102">mon 2</text>
  </g>
  <g font-size="10" fill="#1d2330">
    <text x="426" y="117">admin hashed, the others turned</text>
    <text x="426" y="130">into a hash at the first login</text>
    <text x="426" y="145" fill="#6b7385">3 wrong: closed; 5: locked 30 s</text>
  </g>
  <path d="M404 108 H416" stroke="#1d2330" stroke-width="1.5" marker-end="url(#arrk)"/>

  <!-- a line typed -->
  <path d="M525 152 V168" stroke="#1d2330" stroke-width="1.5" marker-end="url(#arrk)"/>
  <rect x="248" y="170" width="384" height="66" rx="4" fill="#fff" stroke="#9aa3b2"/>
  <text x="256" y="185" font-size="10" font-weight="600" fill="#1d2330">a line typed, in this order <tspan font-weight="400" fill="#6b7385">with the session's own role</tspan></text>
  <g font-size="10" fill="#1d2330">
    <text x="256" y="202" font-weight="600">built in</text>
    <text x="256" y="215" font-size="9" font-family="ui-monospace, Consolas, monospace">help who ver cd</text>
    <text x="256" y="228">log on 4: the log, live</text>
    <text x="384" y="202" font-weight="600">pro_oncmd</text>
    <text x="384" y="215">main.shell_cmd: plant,</text>
    <text x="384" y="228">pump on, pump off, ping</text>
    <text x="512" y="202" font-weight="600">anything else</text>
    <text x="512" y="215">is script: 1+1,</text>
    <text x="512" y="228" font-size="9" font-family="ui-monospace, Consolas, monospace">evt.GetValue(..)</text>
  </g>
  <g stroke="#6b7385" stroke-width="1.5"><path d="M362 210 H376" marker-end="url(#arrk)"/><path d="M490 210 H504" marker-end="url(#arrk)"/></g>

  <!-- gate 3: the elements -->
  <path d="M440 236 V252" stroke="#1d2330" stroke-width="1.5" marker-end="url(#arrk)"/>
  <rect x="248" y="254" width="384" height="114" rx="4" fill="#fff" stroke="#9aa3b2"/>
  <use href="#gate" x="260" y="268"/><text x="260" y="272" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">3</text>
  <text x="274" y="272" font-size="10" font-weight="600" fill="#1d2330">xdb_acl on the element <tspan font-weight="400" fill="#6b7385">the same over MQTT or REST</tspan></text>
  <g font-size="9.5" font-family="ui-monospace, Consolas, monospace" fill="#1d2330">
    <text x="340" y="288">LEVEL</text><text x="414" y="288">PUMP</text><text x="488" y="288">MAINT</text><text x="562" y="288">SECRET</text>
  </g>
  <g font-size="9" font-family="ui-monospace, Consolas, monospace" fill="#6b7385">
    <text x="340" y="300">none</text><text x="414" y="300">0xFF333111</text><text x="488" y="300">0xFF111111</text><text x="562" y="300">0xF0000000</text>
  </g>
  <path d="M256 305 H624" stroke="#dfe3ea"/>
  <g font-size="10" fill="#1d2330">
    <text x="256" y="319">admin 7</text><text x="256" y="333">eng 6</text><text x="256" y="347">opr 3</text><text x="256" y="361">mon 2</text>
  </g>
  <g font-size="10">
    <g fill="#d9731a"><text x="340" y="319">write</text><text x="340" y="333">write</text><text x="340" y="347">write</text><text x="340" y="361">write</text></g>
    <g fill="#2e8b57"><text x="414" y="319">write</text><text x="414" y="333">write</text><text x="414" y="347">write</text></g>
    <text x="414" y="361" fill="#1d2330">read</text>
    <g fill="#2e8b57"><text x="488" y="319">write</text><text x="488" y="333">write</text></g>
    <g fill="#1d2330"><text x="488" y="347">read</text><text x="488" y="361">read</text></g>
    <text x="562" y="319" fill="#2e8b57">write</text>
    <g fill="#c0392b"><text x="562" y="333">nothing</text><text x="562" y="347">nothing</text><text x="562" y="361">nothing</text></g>
  </g>

  <!-- legend -->
  <g font-size="11" fill="#1d2330">
    <path d="M16 404 H40" stroke="#1d2330" stroke-width="2"/><text x="46" y="408">telnet, plain or inside TLS</text>
    <use href="#gate" x="222" y="404"/><text x="222" y="408" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">n</text>
    <text x="236" y="408">a gate; none replaces another</text>
    <text x="420" y="408" fill="#d9731a">orange: no ACL, every role writes</text>
  </g>
  <text x="16" y="430" font-size="11" fill="#6b7385">The shell is not privileged: a command runs with the session's role. Plain telnet carries the password</text>
  <text x="16" y="446" font-size="11" fill="#6b7385">in clear text, so both stay on 127.0.0.1; off this machine use 2324 with a certificate of your own.</text>
</svg>
