# The examples this server publishes, one per line:
#
#   label     path in the repository              port   [roots=ID:label,...]
#
# Each example runs in its own engine process (systemd unit aymon-demo@<PRJ dir>) and is
# published at https://<label>.$DEMO_DOMAIN/ ; nginx proxies it to 127.0.0.1:<port>, the
# port the example already listens on. Nothing else of an example leaves the machine.
#
# roots= is for a project that hosts several roots behind one door (PRJEDU_sites): each
# ID gets https://<label>.$DEMO_DOMAIN/ and the deployed copy's root_host is extended with
# that name. The project's own label is NOT published: its host page gives every visitor
# Engineer (con_role="6"). Reach it through an SSH tunnel (README, "The host page").
#
# Why an example is in which group: README, "Which examples".

# ---- A: every document keeps a visitor (Guest, role 0) off its configuration --------------
vision      examples/ai-vision/PRJEDU_vision      8113
sqlite      examples/data/PRJEDU_sqlite           8106
mirror      examples/data/PRJEDU_mirror           8117
sqlxdb      examples/data/PRJEDU_sqlxdb           8118
xdbsql      examples/data/PRJEDU_xdbsql           8119
pages       examples/web/PRJEDU_pages             8115
fan         examples/board/PRJHW_fan              8120
lock        examples/board/PRJHW_lock             8121
reverse     examples/board/PRJHW_reverse          8122
durable     examples/data/PRJEDU_durable          8124
sites       examples/hosting/PRJEDU_sites         8125   roots=ACME:acme,BETA:beta

# ---- B: the page is guarded, but the simulator beside it (another document of the same
#      process) has no xdb_acl: a visitor can stop or change the simulator through the
#      page's /mqtt until the next reset. The sandbox keeps it inside the example.
modbus      examples/protocols/PRJEDU_modbus      8103
mqtt        examples/protocols/PRJEDU_mqtt        8104
snmp        examples/protocols/PRJEDU_snmp        8105
pid         examples/labs/PRJEDU_pid              8092
oee         examples/labs/PRJEDU_oee              8100
robotarm    examples/labs/PRJEDU_robotarm         8098
records     examples/data/PRJEDU_records          8116
adsb        examples/hobby/PRJPER_adsb            8097

# ---- not published (README says why) ------------------------------------------------------
#net        examples/data/PRJEDU_net              8114   B, and its open documents are an FTP and a mail server that write files
#tello      examples/hobby/PRJPER_tello           8090   B; no video decoding on Linux
#gauge      examples/ai-vision/PRJEDU_gauge       8091   needs Python 3.11 + numpy (Debian 12 only)
#pycall     examples/ai-vision/PRJEDU_pycall      8112   needs Python 3.11 (Debian 12 only)
#opcua      examples/protocols/PRJEDU_opcua       8102   needs its Python OPC UA machine (setup.sh)
#odbc       examples/data/PRJEDU_odbc             8107   needs an ODBC database
# never:    PRJEDU_web (no xdb_acl at all: a visitor can change its connections' settings),
#           PRJEDU_hardening (weak on purpose), PRJEDU_plc (its HMI needs a second port, 8094,
#           whose document is open), PRJEDU_telnet, PRJEDU_mcp, PRJEDU_robot_mcp (MCP never
#           public), PRJPER_phone, the cluster examples (several engines, replication ports),
#           PRJEDU_101 (no page)
