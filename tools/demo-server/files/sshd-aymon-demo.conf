# AyMON public demo -- /etc/ssh/sshd_config.d/10-aymon-demo.conf (written by install.sh).
# sshd takes the FIRST value it reads for a setting and reads sshd_config.d/ in name order,
# so this file wins over a later 50-cloud-init.conf that turns passwords back on.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes
PermitRootLogin prohibit-password
MaxAuthTries 3
LoginGraceTime 20
X11Forwarding no
AllowAgentForwarding no
# -L only: the way to the hosting example's own page (README, "The host page")
AllowTcpForwarding local
